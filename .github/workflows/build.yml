name: Build unsigned fullscreen IPA

on:
  push:
    branches: [codex/serverless-fullscreen]
    paths: ['KonomiTV-iOS/**', 'tests/**', '.github/workflows/build.yml']
  workflow_dispatch:

# Actions成果物だけを保存し、タグや公開リリースは作らない。
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      TZ: Asia/Tokyo
      APP_VERSION: '0.2.2'
      BUILD_NUMBER: '${{ github.run_number }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test injected script against pinned public client
        env:
          BROWSER: webkit
        run: |
          mkdir -p artifacts/reference artifacts/verification
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/tsukumijima/KonomiTV/0a32188274b81c1e7bed642474b208bd2a543a6b/client/src/services/player/PlayerController.ts' -o artifacts/reference/PlayerController-v0.14.1.ts
          npm install --prefix artifacts/tooling --no-audit --no-fund playwright@1.65.1
          export PLAYWRIGHT_MODULE="$PWD/artifacts/tooling/node_modules/playwright"
          node artifacts/tooling/node_modules/playwright/cli.js install webkit
          node --check KonomiTV-iOS/KonomiTV-iOS/FullscreenBridge.js
          node tests/fullscreen-browser.cjs
      - name: Test native diagnostic validation
        run: |
          swiftc -swift-version 5 KonomiTV-iOS/KonomiTV-iOS/PlaybackDiagnostics.swift tests/diagnostics.swift -o artifacts/verification/diagnostics-tests
          artifacts/verification/diagnostics-tests
      - name: Release build without signing
        run: |
          set -o pipefail
          xcodebuild -version | tee artifacts/verification/xcode-version.txt
          xcodebuild build \
            -project KonomiTV-iOS/KonomiTV-iOS.xcodeproj \
            -scheme KonomiTV-iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath artifacts/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee artifacts/verification/release-build.log
      - name: Package and identify unsigned IPA
        run: |
          set -euo pipefail
          OUT="artifacts/ipa/$APP_VERSION-$BUILD_NUMBER-$GITHUB_SHA"
          mkdir -p "$OUT/Payload"
          cp -R artifacts/DerivedData/Build/Products/Release-iphoneos/KonomiTV-iOS.app "$OUT/Payload/"
          APP="$OUT/Payload/KonomiTV-iOS.app"
          test -s "$APP/FullscreenBridge.js"
          test -s "$APP/KonomiTV-iOS"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          test ! -d "$APP/_CodeSignature"
          IPA="KonomiTV-Fullscreen-$APP_VERSION-$BUILD_NUMBER-$GITHUB_SHA-unsigned.ipa"
          (cd "$OUT" && zip -qr "$IPA" Payload)
          shasum -a 256 "$OUT/$IPA" | tee "$OUT/SHA256SUMS.txt"
          python3 - <<'PY'
          import json, os, pathlib
          out = pathlib.Path('artifacts/ipa') / f"{os.environ['APP_VERSION']}-{os.environ['BUILD_NUMBER']}-{os.environ['GITHUB_SHA']}"
          metadata = {key: os.environ[key] for key in ['APP_VERSION','BUILD_NUMBER','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_REPOSITORY']}
          metadata['upstream_baseline'] = 'ba809b4451095e8c53efc1b8c1dce820c0587eb9'
          metadata['actions_url'] = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          (out / 'build-metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          PY
      - name: Upload IPA and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullscreen-0.2.2-${{ github.run_number }}-${{ github.sha }}
          path: |
            artifacts/ipa/**/*.ipa
            artifacts/ipa/**/SHA256SUMS.txt
            artifacts/ipa/**/build-metadata.json
            artifacts/verification/
          if-no-files-found: error
