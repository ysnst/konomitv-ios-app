name: Build (unsigned IPA)

# 試作の本線は「署名なし IPA を作り、本人の無料 Apple ID でサイドロード時に署名する」流れ。
# このワークフローは署名を一切しない (証明書・プロファイルは使わない)。
# 有料プランでの TestFlight 配布は、将来このファイルとは別のワークフローに分ける。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 固定タグのリリースへ IPA を置くため、リリースへの書き込み権限が要る。
permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    # 成果物 zip に記録される時刻がビルド機の現地時刻（世界標準時）の壁時計になり、
    # 解凍したときに日本時間とずれて見えるのを防ぐため、ジョブ全体を日本時間にする。
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone to Asia/Tokyo
        run: |
          sudo systemsetup -settimezone "Asia/Tokyo"
          systemsetup -gettimezone
          date

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -project KonomiTV-iOS/KonomiTV-iOS.xcodeproj \
            -scheme KonomiTV-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/KonomiTV-iOS.app" build/Payload/
          cd build
          zip -r KonomiTV-iOS-unsigned.ipa Payload
          ls -lh KonomiTV-iOS-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KonomiTV-iOS-unsigned-ipa
          path: build/KonomiTV-iOS-unsigned.ipa
          if-no-files-found: error

      # 成果物 zip は解凍すると IPA の時刻が世界標準時の数字で出て不便だったため、
      # 取り方の本線は「固定タグのリリースに IPA をそのまま置く」形に切り替えた（2026-11-22）。
      # 毎回のビルドで同じリリースの中身（IPA と説明）を差し替える。
      - name: Publish IPA to fixed release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="sideload-latest"
          IPA="build/KonomiTV-iOS-unsigned.ipa"
          NOTES="ビルド日時（日本時間）: $(date '+%Y/%m/%d %H:%M')
          Actions 実行 ID: ${{ github.run_id }}
          実行ページ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "最新の試作用IPA" --notes "$NOTES" --prerelease
          else
            gh release create "$TAG" --title "最新の試作用IPA" --notes "$NOTES" --prerelease
          fi
          gh release upload "$TAG" "$IPA" --clobber
          gh release view "$TAG"
