name: Build (unsigned IPA)

# 試作の本線は「署名なし IPA を作り、本人の無料 Apple ID でサイドロード時に署名する」流れ。
# このワークフローは署名を一切しない (証明書・プロファイルは使わない)。
# 有料プランでの TestFlight 配布は、将来このファイルとは別のワークフローに分ける。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    # 成果物 zip に記録される時刻がビルド機の現地時刻（世界標準時）の壁時計になり、
    # 解凍したときに日本時間とずれて見えるのを防ぐため、ジョブ全体を日本時間にする。
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set timezone to Asia/Tokyo
        run: |
          sudo systemsetup -settimezone "Asia/Tokyo"
          systemsetup -gettimezone
          date

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -project KonomiTV-iOS/KonomiTV-iOS.xcodeproj \
            -scheme KonomiTV-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/KonomiTV-iOS.app" build/Payload/
          cd build
          zip -r KonomiTV-iOS-unsigned.ipa Payload
          ls -lh KonomiTV-iOS-unsigned.ipa

      # upload-artifact はファイルの更新時刻を世界標準時の壁時計として zip に書くため、
      # タイムゾーンを日本時間にしても解凍時の表示は世界標準時のままだった（2026-11-22 実機で確認）。
      # そこで梱包直前に IPA の更新時刻そのものを9時間進め、
      # 世界標準時として書かれても日本時間の数字に見えるようにする。
      - name: Shift IPA timestamp +9h for artifact zip
        run: |
          touch -t $(date -v+9H +%Y%m%d%H%M.%S) build/KonomiTV-iOS-unsigned.ipa
          ls -l build/KonomiTV-iOS-unsigned.ipa
          date

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: KonomiTV-iOS-unsigned-ipa
          path: build/KonomiTV-iOS-unsigned.ipa
          if-no-files-found: error
